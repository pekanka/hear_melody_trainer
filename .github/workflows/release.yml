name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build executable
        run: python -m PyInstaller --onefile --windowed --name MelodyEarTrainer melody_ear_trainer.py

      - name: Publish release
        run: gh release create "$env:RELEASE_TAG" "dist/MelodyEarTrainer.exe" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
